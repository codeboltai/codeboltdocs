<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Project tool integration flow</title>
  <desc id="desc">Project tools connect to Codebolt agents through either MCP servers for agent-initiated API calls or webhooks for event-driven workflows.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a0f19" flood-opacity="0.26"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#8FA1B5"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1132" height="512" rx="18" fill="#0C1117" stroke="#222C38"/>

  <text x="590" y="64" text-anchor="middle" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="1.1">
    PROJECT TOOL INTEGRATIONS
  </text>
  <text x="590" y="98" text-anchor="middle" font-size="30" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="760">
    Two ways agents connect to project tools
  </text>
  <text x="590" y="126" text-anchor="middle" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    Use MCP when an agent needs tool access, and webhooks when an external event should start agent work.
  </text>

  <text x="90" y="178" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="800" letter-spacing="0.8">
    MCP SERVER PATH
  </text>
  <text x="90" y="204" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    Agent-initiated actions such as reading issues, creating records, or posting comments.
  </text>

  <g filter="url(#cardShadow)">
    <rect x="90" y="232" width="178" height="96" rx="10" fill="#141C26" stroke="#28323E"/>
  </g>
  <rect x="90" y="232" width="5" height="96" fill="#2dd4bf"/>
  <text x="120" y="264" font-size="19" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">Agent</text>
  <text x="120" y="288" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">decides what to do</text>
  <text x="120" y="309" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#75E6D7">tool call</text>

  <path d="M 268 280 L 346 280" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="346" y="220" width="214" height="120" rx="12" fill="#16202B" stroke="#2dd4bf" stroke-width="1.4"/>
  </g>
  <rect x="346" y="220" width="5" height="120" fill="#2dd4bf"/>
  <text x="378" y="256" font-size="20" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#F4F7FB" font-weight="740">MCP Server</text>
  <text x="378" y="282" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">exposes tool actions</text>
  <text x="378" y="304" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">handles credentials</text>

  <path d="M 560 280 L 638 280" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="599" y="262" text-anchor="middle" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#75E6D7">API</text>

  <g filter="url(#cardShadow)">
    <rect x="638" y="232" width="210" height="96" rx="10" fill="#141C26" stroke="#28323E"/>
  </g>
  <rect x="638" y="232" width="5" height="96" fill="#2dd4bf"/>
  <text x="668" y="264" font-size="19" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">Project Tool</text>
  <text x="668" y="288" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">issues, PRs, docs</text>
  <text x="668" y="309" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">source of record</text>

  <path d="M 638 316 C 552 388, 408 388, 346 320" fill="none" stroke="#8FA1B5" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrowMuted)"/>
  <text x="490" y="378" text-anchor="middle" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">result returns to agent</text>

  <line x1="90" y1="408" x2="1090" y2="408" stroke="#263442" stroke-width="1"/>

  <text x="90" y="452" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="800" letter-spacing="0.8">
    WEBHOOK PATH
  </text>
  <text x="90" y="478" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    Event-driven work such as new issues, review requests, status changes, or external updates.
  </text>

  <g filter="url(#cardShadow)">
    <rect x="650" y="424" width="180" height="78" rx="10" fill="#141C26" stroke="#28323E"/>
  </g>
  <rect x="650" y="424" width="5" height="78" fill="#2dd4bf"/>
  <text x="678" y="454" font-size="18" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">Project Tool</text>
  <text x="678" y="478" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">emits event</text>

  <path d="M 650 464 L 558 464" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="604" y="446" text-anchor="middle" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#75E6D7">POST</text>

  <g filter="url(#cardShadow)">
    <rect x="370" y="424" width="188" height="78" rx="10" fill="#16202B" stroke="#2dd4bf" stroke-width="1.4"/>
  </g>
  <rect x="370" y="424" width="5" height="78" fill="#2dd4bf"/>
  <text x="398" y="454" font-size="18" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#F4F7FB" font-weight="740">Routing Gateway</text>
  <text x="398" y="478" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">routes webhook</text>

  <path d="M 370 464 L 278 464" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="98" y="424" width="180" height="78" rx="10" fill="#141C26" stroke="#28323E"/>
  </g>
  <rect x="98" y="424" width="5" height="78" fill="#2dd4bf"/>
  <text x="126" y="454" font-size="18" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">Agent</text>
  <text x="126" y="478" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">acts on payload</text>

  <path d="M 278 496 C 390 536, 548 536, 650 496" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="464" y="532" text-anchor="middle" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">optional update or reply back to the tool</text>

  <rect x="884" y="230" width="206" height="108" rx="18" fill="#0F1720" stroke="#263442"/>
  <text x="987" y="260" text-anchor="middle" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">RULE OF THUMB</text>
  <text x="987" y="288" text-anchor="middle" font-size="13.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">MCP lets agents pull</text>
  <text x="987" y="310" text-anchor="middle" font-size="13.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">or update tool data.</text>
  <text x="987" y="332" text-anchor="middle" font-size="13.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">Webhooks start work.</text>
</svg>
