<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" role="img" aria-labelledby="title desc">
  <title id="title">Chat platform channel plugin flow</title>
  <desc id="desc">A user message reaches a chat platform, the channel plugin forwards it to the Codebolt Routing Gateway, the agent replies, and the channel plugin sends the reply back to the user.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0a0f19" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1132" height="452" rx="18" fill="#0C1117" stroke="#222C38"/>

  <text x="590" y="64" text-anchor="middle" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="1.1">
    CHAT PLATFORM INTEGRATIONS
  </text>
  <text x="590" y="98" text-anchor="middle" font-size="30" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="760">
    Channel plugin message flow
  </text>
  <text x="590" y="126" text-anchor="middle" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    The plugin translates platform events into gateway.route and sends gateway.reply back through the platform SDK.
  </text>

  <g filter="url(#cardShadow)">
    <rect x="64" y="192" width="150" height="92" rx="12" fill="#141C26" stroke="#28323E"/>
  </g>
  <rect x="64" y="192" width="5" height="92" fill="#2dd4bf"/>
  <text x="88" y="220" font-size="11" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">STEP 1</text>
  <text x="88" y="248" font-size="18" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">User</text>
  <text x="88" y="270" font-size="12.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">sends a message</text>

  <path d="M 214 238 L 272 238" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="272" y="192" width="180" height="92" rx="12" fill="#141C26" stroke="#28323E"/>
  </g>
  <rect x="272" y="192" width="5" height="92" fill="#2dd4bf"/>
  <text x="296" y="220" font-size="11" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">STEP 2</text>
  <text x="296" y="248" font-size="18" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">Platform SDK</text>
  <text x="296" y="270" font-size="12.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">platform API or SDK</text>

  <path d="M 452 238 L 510 238" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="510" y="176" width="190" height="124" rx="12" fill="#141C26" stroke="#28323E"/>
  </g>
  <rect x="510" y="176" width="5" height="124" fill="#2dd4bf"/>
  <text x="534" y="206" font-size="11" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">STEP 3</text>
  <text x="534" y="234" font-size="18" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">Channel Plugin</text>
  <text x="534" y="258" font-size="12.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">normalizes the event</text>
  <text x="534" y="280" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#75E6D7">gateway.route</text>

  <path d="M 700 238 L 758 238" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="758" y="176" width="190" height="124" rx="12" fill="#16202B" stroke="#2dd4bf" stroke-width="1.4"/>
  </g>
  <rect x="758" y="176" width="5" height="124" fill="#2dd4bf"/>
  <text x="782" y="206" font-size="11" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">STEP 4</text>
  <text x="782" y="234" font-size="18" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#F4F7FB" font-weight="740">Routing Gateway</text>
  <text x="782" y="258" font-size="12.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">resolves agent and thread</text>
  <text x="782" y="280" font-size="12.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">tracks reply target</text>

  <path d="M 948 238 L 1006 238" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#cardShadow)">
    <rect x="1006" y="192" width="130" height="92" rx="12" fill="#141C26" stroke="#28323E"/>
  </g>
  <rect x="1006" y="192" width="5" height="92" fill="#2dd4bf"/>
  <text x="1030" y="220" font-size="11" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">STEP 5</text>
  <text x="1030" y="248" font-size="18" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">Agent</text>
  <text x="1030" y="270" font-size="12.5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">processes reply</text>

  <path d="M 1070 284 C 1028 392, 672 392, 606 304" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="828" y="378" text-anchor="middle" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#2dd4bf">gateway.reply</text>

  <path d="M 510 304 C 450 382, 200 382, 140 288" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="318" y="408" text-anchor="middle" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">plugin sends the reply back through the platform SDK</text>

  <rect x="354" y="426" width="472" height="34" rx="17" fill="#0F1720" stroke="#263442"/>
  <text x="590" y="448" text-anchor="middle" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    Each platform changes only the plugin; the gateway and agent flow stay the same.
  </text>
</svg>
