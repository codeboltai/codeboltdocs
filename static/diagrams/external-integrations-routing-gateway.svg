<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">External integrations routing gateway flow</title>
  <desc id="desc">External platforms send messages through a channel plugin to the Codebolt Routing Gateway, which routes work to an agent and returns the response through the plugin.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a0f19" flood-opacity="0.26"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1052" height="372" rx="14" fill="#0C1117" stroke="#222C38" stroke-width="1"/>

  <text x="550" y="62" text-anchor="middle" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="1.1">
    EXTERNAL INTEGRATIONS
  </text>
  <text x="550" y="96" text-anchor="middle" font-size="30" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="760">
    Routing Gateway flow
  </text>
  <text x="550" y="124" text-anchor="middle" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    Channel plugins adapt external APIs to the shared gateway route and reply protocol.
  </text>

  <g filter="url(#cardShadow)">
    <rect x="70" y="178" width="190" height="102" rx="10" fill="#141C26" stroke="#28323E" stroke-width="1"/>
  </g>
  <rect x="70" y="178" width="5" height="102" fill="#2dd4bf"/>
  <text x="100" y="206" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">
    PLATFORM
  </text>
  <text x="100" y="235" font-size="20" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">
    Telegram / Slack
  </text>
  <text x="100" y="259" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">
    Discord / custom API
  </text>

  <g filter="url(#cardShadow)">
    <rect x="330" y="178" width="180" height="102" rx="10" fill="#141C26" stroke="#28323E" stroke-width="1"/>
  </g>
  <rect x="330" y="178" width="5" height="102" fill="#2dd4bf"/>
  <text x="360" y="206" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">
    ADAPTER
  </text>
  <text x="360" y="235" font-size="20" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">
    Channel Plugin
  </text>
  <text x="360" y="259" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">
    platform SDK bridge
  </text>

  <g filter="url(#cardShadow)">
    <rect x="580" y="164" width="210" height="130" rx="12" fill="#16202B" stroke="#2dd4bf" stroke-width="1.4"/>
  </g>
  <rect x="580" y="164" width="5" height="130" fill="#2dd4bf"/>
  <text x="615" y="197" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="800" letter-spacing="0.7">
    CODEBOLT
  </text>
  <text x="615" y="228" font-size="22" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#F4F7FB" font-weight="760">
    Routing Gateway
  </text>
  <text x="615" y="254" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">
    resolves agent and thread
  </text>
  <text x="615" y="274" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">
    routes replies back out
  </text>

  <g filter="url(#cardShadow)">
    <rect x="860" y="178" width="170" height="102" rx="10" fill="#141C26" stroke="#28323E" stroke-width="1"/>
  </g>
  <rect x="860" y="178" width="5" height="102" fill="#2dd4bf"/>
  <text x="890" y="206" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#2dd4bf" font-weight="750" letter-spacing="0.7">
    WORKER
  </text>
  <text x="890" y="235" font-size="20" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#D8DFEA" font-weight="720">
    Agent
  </text>
  <text x="890" y="259" font-size="14" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#AAB6C5">
    processes and replies
  </text>

  <path d="M 260 229 L 325 229" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.78" marker-end="url(#arrowMuted)"/>
  <text x="292" y="215" text-anchor="middle" font-size="12" font-family="ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,monospace" fill="#75E6D7">
    event
  </text>

  <path d="M 510 218 L 575 218" fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="542" y="201" text-anchor="middle" font-size="12" font-family="ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,monospace" fill="#2dd4bf">
    gateway.route
  </text>

  <path d="M 790 218 L 855 218" fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="822" y="201" text-anchor="middle" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    dispatch
  </text>

  <path d="M 860 264 C 760 350, 490 350, 420 284" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="642" y="338" text-anchor="middle" font-size="12" font-family="ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,monospace" fill="#2dd4bf">
    gateway.reply
  </text>

  <path d="M 330 264 C 265 332, 165 326, 165 285" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 7" opacity="0.78" marker-end="url(#arrowMuted)"/>
  <text x="242" y="326" text-anchor="middle" font-size="12" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    platform response
  </text>

  <rect x="344" y="316" width="412" height="38" rx="19" fill="#0F1720" stroke="#263442" stroke-width="1"/>
  <text x="550" y="339" text-anchor="middle" font-size="13" font-family="Inter,ui-sans-serif,system-ui,sans-serif" fill="#8FA1B5">
    One gateway protocol lets each platform stay out of the core application.
  </text>
</svg>
